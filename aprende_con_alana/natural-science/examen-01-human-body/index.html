  <header class="cabecera">

      <h1 id="seccion-titulo">🫀 The human body</h1>
      <p id="seccion-subtitulo" class="subtitulo">Loading...</p>
    </div>
    <div class="puntuacion" aria-label="Current score">
      <span class="estrella">⭐</span>
      <span id="puntos">0</span>
    </div>
    <div class="cron-chip" id="cron-chip" hidden aria-label="Time">
      <span>⏱️</span>
      <span id="cron-tiempo">0s</span>
    </div>
  </header>

  <div class="barra-progreso" aria-hidden="true">

      Check my answers ✓

      Next part →
    </button>
    <button id="btn-final" class="boton boton-final" type="button" hidden>
      See my result 🎉
    </button>
  </footer>

  <div id="modal-final" class="modal" hidden>
    <div class="modal-contenido">
      <div class="modal-emoji" id="modal-emoji">🎉</div>
      <h2 id="modal-titulo">Well done!</h2>
      <p id="modal-mensaje" class="modal-mensaje"></p>
      <p id="modal-tiempo" class="modal-tiempo" hidden></p>
      <div class="modal-stats">
        <div class="stat"><span class="stat-num" id="stat-correctas">0</span><span class="stat-label">Correct</span></div>
        <div class="stat"><span class="stat-num" id="stat-total">0</span><span class="stat-label">Total</span></div>
        <div class="stat"><span class="stat-num" id="stat-porcentaje">0%</span><span class="stat-label">Mark</span></div>
      </div>
      <button class="boton boton-reiniciar" type="button" onclick="location.reload()">Try again 🔄</button>
      <a class="boton boton-volver" href="../index.html">Back to Natural Science</a>
    </div>
  </div>

  <canvas id="confeti" aria-hidden="true"></canvas>
