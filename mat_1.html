<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repaso de Matemáticas</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f0f4ff;--card:#fff;--red:#ef4444;--blue:#3b82f6;--green:#22c55e;--purple:#a855f7;--teal:#14b8a6;--orange:#f97316;--dark:#1e293b;--muted:#64748b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;padding:16px;}
  .header{text-align:center;margin-bottom:20px;}
  .header h1{font-family:'Fredoka One',cursive;font-size:1.85rem;color:var(--dark);}
  .header p{color:var(--muted);font-size:.88rem;margin-top:4px;}
  .section-tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;}
  .tab-btn{padding:7px 12px;border:none;border-radius:999px;font-family:'Nunito',sans-serif;font-weight:700;font-size:.76rem;cursor:pointer;transition:all .2s;opacity:.5;background:#e2e8f0;color:var(--dark);}
  .tab-btn.active{opacity:1;color:#fff;transform:scale(1.05);}
  .tab-btn.done{opacity:.85;color:#fff;}
  .tab-btn[data-sec="0"].active,.tab-btn[data-sec="0"].done{background:var(--red);}
  .tab-btn[data-sec="1"].active,.tab-btn[data-sec="1"].done{background:var(--blue);}
  .tab-btn[data-sec="2"].active,.tab-btn[data-sec="2"].done{background:var(--green);}
  .tab-btn[data-sec="3"].active,.tab-btn[data-sec="3"].done{background:var(--purple);}
  .tab-btn[data-sec="4"].active,.tab-btn[data-sec="4"].done{background:var(--teal);}
  .tab-btn[data-sec="5"].active,.tab-btn[data-sec="5"].done{background:var(--orange);}
  .progress-wrap{background:#e2e8f0;border-radius:999px;height:9px;margin-bottom:16px;overflow:hidden;}
  .progress-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#6366f1,#8b5cf6);transition:width .4s;}
  .progress-label{text-align:center;font-size:.78rem;color:var(--muted);margin-bottom:5px;font-weight:700;}
  .question-card{background:var(--card);border-radius:20px;padding:22px;max-width:680px;margin:0 auto;box-shadow:0 4px 24px rgba(0,0,0,.08);animation:slideIn .3s ease;}
  @keyframes slideIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .sec-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 12px;border-radius:999px;font-size:.73rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#fff;margin-bottom:11px;}
  .q-num{font-size:.73rem;font-weight:700;color:var(--muted);margin-bottom:6px;}
  .q-text{font-size:1.05rem;font-weight:700;color:var(--dark);margin-bottom:15px;line-height:1.5;}
  .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;}
  .opt-btn{padding:11px 14px;border-radius:12px;border:2px solid #e2e8f0;background:#f8fafc;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s;color:var(--dark);text-align:left;display:flex;align-items:center;gap:9px;line-height:1.3;}
  .opt-btn:hover:not(:disabled){border-color:#6366f1;background:#eef2ff;transform:translateY(-2px);}
  .opt-btn .ltr{min-width:26px;height:26px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:800;color:var(--muted);transition:all .2s;flex-shrink:0;}
  .opt-btn.correct{border-color:var(--green);background:#f0fdf4;}
  .opt-btn.correct .ltr{background:var(--green);color:#fff;}
  .opt-btn.wrong{border-color:var(--red);background:#fef2f2;}
  .opt-btn.wrong .ltr{background:var(--red);color:#fff;}
  .opt-btn:disabled{cursor:not-allowed;}
  .feedback{display:none;padding:11px 15px;border-radius:12px;font-weight:700;font-size:.9rem;margin-bottom:12px;align-items:center;gap:8px;flex-wrap:wrap;}
  .feedback.show{display:flex;}
  .feedback.ok{background:#f0fdf4;color:#16a34a;border:2px solid #86efac;}
  .feedback.no{background:#fef2f2;color:#dc2626;border:2px solid #fca5a5;}
  .nav-row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:4px;}
  .nav-btn{padding:9px 22px;border-radius:12px;border:none;font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;cursor:pointer;transition:all .2s;}
  .nav-btn.prev{background:#e2e8f0;color:var(--dark);}
  .nav-btn.prev:hover{background:#cbd5e1;}
  .nav-btn.next{background:#6366f1;color:#fff;}
  .nav-btn.next:hover{background:#4f46e5;}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed;}
  .score-chip{background:#f1f5f9;border-radius:999px;padding:5px 12px;font-weight:800;font-size:.8rem;color:var(--dark);}
  /* THERMO */
  .thermo-wrap{display:flex;align-items:center;gap:18px;background:#f8fafc;border-radius:12px;padding:14px;margin-bottom:14px;}
  /* GRID */
  .grid-visual{display:flex;justify-content:center;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:14px;}
  .grid-item{display:inline-block;text-align:center;}
  .grid-lbl{font-size:.78rem;font-weight:800;color:var(--muted);margin-top:5px;}
  /* COMPARE numbers */
  .cmp-number-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .cmp-num{background:#f1f5f9;border-radius:16px;padding:18px 28px;font-size:2rem;font-weight:900;color:var(--dark);min-width:110px;text-align:center;border:2px solid #e2e8f0;font-family:'Fredoka One',cursive;}
  .cmp-blank{background:#fff;border:3px dashed #6366f1;border-radius:14px;padding:16px 24px;font-size:2rem;font-weight:900;color:#6366f1;min-width:80px;text-align:center;}
  .sym-wrap{display:flex;gap:12px;justify-content:center;margin-bottom:14px;}
  .sym-btn{width:64px;height:64px;border-radius:14px;border:2px solid #e2e8f0;background:#f8fafc;font-size:1.8rem;font-weight:900;cursor:pointer;transition:all .2s;color:var(--dark);display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;}
  .sym-btn:hover:not(:disabled){border-color:#6366f1;background:#eef2ff;transform:scale(1.12);}
  .sym-btn.correct{border-color:var(--green);background:#f0fdf4;color:var(--green);}
  .sym-btn.wrong{border-color:var(--red);background:#fef2f2;color:var(--red);}
  .sym-btn:disabled{cursor:not-allowed;}
  /* RESULTS */
  .results-screen{display:none;max-width:680px;margin:0 auto;}
  .results-card{background:#fff;border-radius:24px;padding:32px 24px;text-align:center;box-shadow:0 4px 32px rgba(0,0,0,.1);}
  .r-emoji{font-size:3.5rem;margin-bottom:10px;}
  .r-title{font-family:'Fredoka One',cursive;font-size:1.85rem;color:var(--dark);}
  .r-score{font-size:3rem;font-weight:900;margin:12px 0;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .r-msg{color:var(--muted);font-size:.92rem;font-weight:600;margin-bottom:18px;}
  .sec-scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
  .sec-sc{border-radius:12px;padding:11px;text-align:left;}
  .sec-sc .sn{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;opacity:.7;}
  .sec-sc .sp{font-size:1.25rem;font-weight:900;}
  .restart-btn{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;border:none;border-radius:14px;padding:13px 28px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;cursor:pointer;transition:all .2s;width:100%;}
  .restart-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,.4);}
  .confetti-piece{position:fixed;width:9px;height:9px;pointer-events:none;animation:fall 2.5s ease-in forwards;z-index:999;border-radius:2px;}
  @keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @media(max-width:500px){.options-grid{grid-template-columns:1fr;}.sec-scores{grid-template-columns:1fr;}.cmp-num{font-size:1.5rem;padding:14px 18px;}.sym-btn{width:54px;height:54px;font-size:1.5rem;}}
</style>
</head>
<body>
<div class="header">
  <h1>📐 Repaso de Matemáticas</h1>
  <p>Termómetros · Definiciones · Conteo · Rectas · Superficies · Comparar números</p>
</div>
<div class="section-tabs" id="tabs">
  <button class="tab-btn" data-sec="0" onclick="jumpSection(0)">🌡️ Termómetros</button>
  <button class="tab-btn" data-sec="1" onclick="jumpSection(1)">📚 Definiciones</button>
  <button class="tab-btn" data-sec="2" onclick="jumpSection(2)">🔢 Conteo</button>
  <button class="tab-btn" data-sec="3" onclick="jumpSection(3)">📏 Rectas</button>
  <button class="tab-btn" data-sec="4" onclick="jumpSection(4)">📦 Superficies</button>
  <button class="tab-btn" data-sec="5" onclick="jumpSection(5)">⚖️ Comparar</button>
</div>
<div class="progress-label" id="pLabel">Pregunta 1 de 46</div>
<div class="progress-wrap"><div class="progress-bar" id="pBar" style="width:0%"></div></div>
<div class="question-card" id="qCard"></div>
<div class="results-screen" id="resultsScreen">
  <div class="results-card">
    <div class="r-emoji" id="rEmoji">🎉</div>
    <div class="r-title">¡Examen completado!</div>
    <div class="r-score" id="rScore"></div>
    <div class="r-msg" id="rMsg"></div>
    <div class="sec-scores" id="secScores"></div>
    <button class="restart-btn" onclick="restart()">🔄 Volver a intentar</button>
  </div>
</div>

<script>
// ─── THERMOMETER ──────────────────────────────────────────────────────────────
function thermoSVG(min,max,val,labels){
  const tT=12,tB=106,tH=tB-tT;
  const pct=Math.max(0,Math.min(1,(val-min)/(max-min)));
  const mT=Math.round(tB-pct*tH),mH=tB-mT+14;
  const lns=labels.map(l=>{const y=Math.round(tB-((l-min)/(max-min))*tH);
    return `<line x1="46" y1="${y}" x2="52" y2="${y}" stroke="#94a3b8" stroke-width="1.2"/>
            <text x="55" y="${y+4}" font-family="Nunito" font-size="9.5" fill="#475569" font-weight="700">${l}°</text>`;}).join('');
  return `<svg viewBox="0 0 95 130" width="68" height="106">
    <rect x="30" y="${tT}" width="16" height="${tH}" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="32" y="${mT}" width="12" height="${mH}" rx="4" fill="#ef4444"/>
    <circle cx="38" cy="116" r="12" fill="#ef4444" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="35" cy="113" r="4" fill="#fca5a5" opacity=".7"/>
    <rect x="30" y="${tT}" width="16" height="${tH}" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="32" y="${tT+4}" width="4" height="${tH-8}" rx="2" fill="white" opacity=".3"/>
    ${lns}</svg>`;
}

// ─── GRID BUILDER ─────────────────────────────────────────────────────────────
const C=20;
function mkGrid(cols,rows,shapes,gc,label){
  let lines='';
  for(let c=0;c<=cols;c++) lines+=`<line x1="${c*C}" y1="0" x2="${c*C}" y2="${rows*C}" stroke="${gc||'#cbd5e1'}" stroke-width="0.7"/>`;
  for(let r=0;r<=rows;r++) lines+=`<line x1="0" y1="${r*C}" x2="${cols*C}" y2="${r*C}" stroke="${gc||'#cbd5e1'}" stroke-width="0.7"/>`;
  const W=cols*C+2,H=rows*C+2;
  return `<div class="grid-item">
    <svg viewBox="-1 -1 ${W} ${H}" width="${W}" height="${H}">
      ${lines}${shapes}
      <rect x="-1" y="-1" width="${W}" height="${H}" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    </svg>
    ${label?`<div class="grid-lbl">${label}</div>`:''}
  </div>`;
}
function poly(pts,fill,stroke){
  return `<path d="${pts.map((p,i)=>(i?'L':'M')+p[0]*C+' '+p[1]*C).join(' ')}Z" fill="${fill}" stroke="${stroke}" stroke-width="1.8" stroke-linejoin="round"/>`;
}
function sRect3x4(lbl){return mkGrid(5,6,poly([[1,1],[4,1],[4,5],[1,5]],'#bfdbfe','#1d4ed8'),'#dbeafe',lbl);}
function sLShape(lbl) {return mkGrid(5,6,poly([[1,1],[3,1],[3,3],[4,3],[4,5],[1,5]],'#bbf7d0','#15803d'),'#dcfce7',lbl);}
function sTriRT(lbl)  {return mkGrid(6,6,poly([[1,1],[5,1],[1,5]],'#fde68a','#b45309'),'#fef9c3',lbl);}
function sStair(lbl)  {return mkGrid(5,5,poly([[1,4],[1,3],[2,3],[2,2],[3,2],[3,1],[4,1],[4,4]],'#fbcfe8','#be185d'),'#fdf2f8',lbl);}
function sCross(lbl)  {return mkGrid(6,6,poly([[2,1],[4,1],[4,2],[5,2],[5,4],[4,4],[4,5],[2,5],[2,4],[1,4],[1,2],[2,2]],'#fed7aa','#c2410c'),'#fff7ed',lbl);}
function sSq3x3(lbl)  {return mkGrid(5,5,poly([[1,1],[4,1],[4,4],[1,4]],'#e9d5ff','#6d28d9'),'#f5f3ff',lbl);}
function sHouse(){
  const r=[
    poly([[1,1],[3,1],[3,3],[1,3]],'#bfdbfe','#1d4ed8'),
    poly([[3,1],[6,1],[6,4],[3,4]],'#fde68a','#b45309'),
    poly([[1,3],[3,3],[3,6],[1,6]],'#bbf7d0','#15803d'),
    poly([[3,4],[6,4],[6,6],[3,6]],'#fed7aa','#c2410c'),
  ];
  const L=[
    `<text x="${2*C}" y="${2*C}" text-anchor="middle" font-family="Nunito" font-size="8" fill="#1e3a5f" font-weight="800">Hab.1</text>`,
    `<text x="${4.5*C}" y="${2.5*C}" text-anchor="middle" font-family="Nunito" font-size="8" fill="#78350f" font-weight="800">Terraza</text>`,
    `<text x="${2*C}" y="${4.5*C}" text-anchor="middle" font-family="Nunito" font-size="8" fill="#14532d" font-weight="800">Hab.2</text>`,
    `<text x="${4.5*C}" y="${5.2*C}" text-anchor="middle" font-family="Nunito" font-size="8" fill="#7c2d12" font-weight="800">Comedor</text>`,
  ];
  return mkGrid(7,7,r.join('')+L.join(''),'#dbeafe','');
}

// Angle / line SVG
const aSVG={
  recto:`<svg viewBox="0 0 80 68" width="72" height="60"><line x1="10" y1="58" x2="70" y2="58" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/><line x1="10" y1="58" x2="10" y2="8" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/><rect x="10" y="46" width="12" height="12" fill="none" stroke="#2563eb" stroke-width="1.5"/></svg>`,
  agudo:`<svg viewBox="0 0 100 68" width="88" height="60"><line x1="10" y1="58" x2="90" y2="58" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/><line x1="10" y1="58" x2="38" y2="10" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/><path d="M22,58 A14,14 0 0,1 16,44" fill="none" stroke="#16a34a" stroke-width="1.5"/></svg>`,
  obtuso:`<svg viewBox="0 0 100 68" width="88" height="60"><line x1="5" y1="58" x2="95" y2="58" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/><line x1="5" y1="58" x2="80" y2="14" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/><path d="M30,58 A26,26 0 0,1 18,34" fill="none" stroke="#dc2626" stroke-width="1.5"/></svg>`,
  hex:`<svg viewBox="0 0 100 88" width="84" height="74"><polygon points="50,5 88,26 88,62 50,83 12,62 12,26" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round"/><circle cx="50" cy="5" r="3" fill="#3b82f6"/><circle cx="88" cy="26" r="3" fill="#3b82f6"/><circle cx="88" cy="62" r="3" fill="#3b82f6"/><circle cx="50" cy="83" r="3" fill="#3b82f6"/><circle cx="12" cy="62" r="3" fill="#3b82f6"/><circle cx="12" cy="26" r="3" fill="#3b82f6"/></svg>`,
  trap:`<svg viewBox="0 0 110 78" width="94" height="68"><polygon points="20,68 90,68 74,14 36,14" fill="none" stroke="#22c55e" stroke-width="2.5"/><line x1="36" y1="14" x2="90" y2="68" stroke="#22c55e" stroke-width="2.5"/><circle cx="20" cy="68" r="3" fill="#22c55e"/><circle cx="90" cy="68" r="3" fill="#22c55e"/><circle cx="74" cy="14" r="3" fill="#22c55e"/><circle cx="36" cy="14" r="3" fill="#22c55e"/></svg>`,
  xlines:`<svg viewBox="0 0 100 78" width="86" height="68"><line x1="10" y1="8" x2="90" y2="68" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/><line x1="90" y1="8" x2="10" y2="68" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/><circle cx="50" cy="38" r="3.5" fill="#7c3aed"/></svg>`,
  plus:`<svg viewBox="0 0 100 78" width="86" height="68"><line x1="50" y1="4" x2="50" y2="74" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/><line x1="8" y1="39" x2="92" y2="39" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/><rect x="44" y="33" width="12" height="12" fill="none" stroke="#7c3aed" stroke-width="1.5"/></svg>`,
};

// ─── SECTIONS ─────────────────────────────────────────────────────────────────
const SECS=[
  {name:'🌡️ Termómetros',color:'#ef4444',bg:'#fef2f2'},
  {name:'📚 Definiciones',color:'#3b82f6',bg:'#eff6ff'},
  {name:'🔢 Conteo',      color:'#22c55e',bg:'#f0fdf4'},
  {name:'📏 Rectas',      color:'#a855f7',bg:'#faf5ff'},
  {name:'📦 Superficies', color:'#14b8a6',bg:'#f0fdfa'},
  {name:'⚖️ Comparar',   color:'#f97316',bg:'#fff7ed'},
];

// ─── QUESTIONS ────────────────────────────────────────────────────────────────
const Q=[
  // ── 0 TERMÓMETROS ──
  {sec:0,q:'El agua se congela a ___ °C (y a ___ °F).',
   opts:['0 °C / 32 °F','10 °C / 50 °F','-10 °C / 14 °F','100 °C / 212 °F'],ans:0},
  {sec:0,q:'El agua hierve a ___ °C (y a ___ °F).',
   opts:['50 °C / 122 °F','100 °C / 212 °F','90 °C / 194 °F','0 °C / 32 °F'],ans:1},
  {sec:0,q:'Termómetro 7 — ¿Qué temperatura marca?',
   th:{min:30,max:60,val:35,lbs:[30,40,50,60]},
   opts:['30 °C','35 °C','40 °C','45 °C'],ans:1},
  {sec:0,q:'Termómetro 8 — ¿Qué temperatura marca?',
   th:{min:-10,max:10,val:5,lbs:[-10,0,10]},
   opts:['-5 °C','0 °C','5 °C','10 °C'],ans:2},
  {sec:0,q:'Termómetro 9 — ¿Qué temperatura marca?',
   th:{min:50,max:80,val:55,lbs:[50,60,80]},
   opts:['50 °C','55 °C','60 °C','70 °C'],ans:1},
  {sec:0,q:'Termómetro 13 — ¿Qué temperatura marca?',
   th:{min:20,max:50,val:25,lbs:[20,30,40,50]},
   opts:['20 °C','25 °C','30 °C','35 °C'],ans:1},
  {sec:0,q:'Termómetro 14 — ¿Qué temperatura marca?',
   th:{min:40,max:70,val:55,lbs:[40,50,60,70]},
   opts:['50 °C','55 °C','60 °C','65 °C'],ans:1},
  {sec:0,q:'Termómetro 15 — ¿Qué temperatura marca? (¡Cuidado, son negativos!)',
   th:{min:-40,max:-10,val:-30,lbs:[-40,-30,-20,-10]},
   opts:['-10 °C','-20 °C','-30 °C','-40 °C'],ans:2},
  {sec:0,q:'Termómetro 16 — ¿Qué temperatura marca?',
   th:{min:15,max:35,val:22,lbs:[15,20,25,30,35]},
   opts:['20 °C','22 °C','25 °C','30 °C'],ans:1},
  {sec:0,q:'Termómetro 17 — ¿Qué temperatura marca?',
   th:{min:5,max:25,val:15,lbs:[5,10,15,20,25]},
   opts:['10 °C','13 °C','15 °C','20 °C'],ans:2},
  {sec:0,q:'Termómetro 18 — ¿Qué temperatura marca?',
   th:{min:-15,max:5,val:-5,lbs:[-15,-10,-5,0,5]},
   opts:['-10 °C','-5 °C','0 °C','5 °C'],ans:1},
  // ── 1 DEFINICIONES ──
  {sec:1,q:'¿Qué es un segmento de recta?',
   opts:['Una línea que se extiende infinitamente en ambas direcciones','Una porción de recta comprendida entre dos extremos','El espacio entre dos ángulos','Una curva entre dos puntos'],ans:1},
  {sec:1,q:'¿Cuándo se forma un ángulo?',
   opts:['Al unir tres rectas paralelas','Al trazar un solo segmento','Cuando se cortan dos rectas','Cuando hay dos puntos en el plano'],ans:2},
  {sec:1,q:'¿Cómo se llaman las rectas que nunca se cruzan y están siempre a la misma distancia?',
   opts:['Perpendiculares','Oblicuas','Secantes','Paralelas'],ans:3},

   opts:['Solo rectos','Solo agudos','Agudos y obtusos','Solo obtusos'],ans:2},
  {sec:3,q:'Estas dos rectas forman un "+". ¿Qué tipo de rectas son?',svg:aSVG.plus,
   opts:['Paralelas','Perpendiculares','Oblicuas','Divergentes'],ans:1},
  {sec:3,q:'Las rectas en "+" forman ángulos...',svg:aSVG.plus,
   opts:['Solo agudos','Solo rectos (90°)','Solo obtusos','Agudos y obtusos'],ans:1},
  {sec:3,q:'Para saber si dos segmentos que no se ven cruzados se cortan, ¿qué hacemos?',
   opts:['Los borramos y trazamos otros','Los alargamos hasta que se crucen','Los medimos con la regla','Los pintamos de colores distintos'],ans:1},
  // ── 4 SUPERFICIES ──
  {sec:4,
   q:'Cuenta los cuadraditos de esta figura (azul). ¿Cuántas unidades cuadradas tiene?',
   gridA:sRect3x4(''),
   opts:['9 u²','10 u²','12 u²','15 u²'],ans:2},
  {sec:4,
   q:'¿Cuántas unidades cuadradas ocupa esta figura en forma de L (verde)?',
   gridA:sLShape(''),
   opts:['6 u²','8 u²','10 u²','12 u²'],ans:2},

   opts:['4 u²','5 u²','6 u²','7 u²'],ans:2},

  {sec:4,
   q:'En el plano de la casa, ¿qué zona ocupa MÁS superficie?',
   gridA:sHouse(),
   opts:['Habitación 1','Habitación 2','Terraza','Las dos habitaciones juntas'],ans:3},
  // ── 5 COMPARAR NÚMEROS ──
  // Enteros sencillos
  {sec:5,sym:true,numA:'100',numB:'0,08',syms:['<','>','='],symAns:1},
  {sec:5,sym:true,numA:'7',numB:'12',syms:['<','>','='],symAns:0},

  {sec:5,sym:true,numA:'5',numB:'4,9',syms:['<','>','='],symAns:1},

  {sec:5,sym:true,numA:'0,3',numB:'0,30',syms:['<','>','='],symAns:2},

  // Más complejos
  {sec:5,sym:true,numA:'500',numB:'499,9',syms:['<','>','='],symAns:1},
  {sec:5,sym:true,numA:'3,05',numB:'3,5',syms:['<','>','='],symAns:0},
  {sec:5,sym:true,numA:'12,40',numB:'12,4',syms:['<','>','='],symAns:2},
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let cur=0,ans=new Array(Q.length).fill(null),done=new Array(Q.length).fill(false);
function getAns(i){return Q[i].sym?Q[i].symAns:Q[i].ans;}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  if(cur>=Q.length){showResults();return;}
  const q=Q[cur],sec=SECS[q.sec],tot=Q.length;
  document.getElementById('pBar').style.width=(cur/tot*100).toFixed(1)+'%';
  document.getElementById('pLabel').textContent=`Pregunta ${cur+1} de ${tot}`;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    const s=parseInt(b.dataset.sec);b.classList.remove('active','done');
    if(s===q.sec){b.classList.add('active');}
    else if(Q.filter(x=>x.sec===s).every(x=>done[Q.indexOf(x)])) b.classList.add('done');
  });

  let extra='';
  if(q.th){
    const{min,max,val,lbs}=q.th;
    extra=`<div class="thermo-wrap">${thermoSVG(min,max,val,lbs)}
      <div style="font-size:.83rem;color:#64748b;font-weight:600;line-height:1.8;">
        🔴 El mercurio sube con el calor<br>📍 Observa hasta dónde llega<br>
        <span style="font-size:.76rem;">Escala: ${lbs[0]}° → ${lbs[lbs.length-1]}°</span>
      </div></div>`;
  } else if(q.gridA){
    extra=`<div class="grid-visual">${q.gridA}</div>`;
  } else if(q.svg){
    extra=`<div class="grid-visual">${q.svg}</div>`;
  }

  const letters=['A','B','C','D'];
  let ctrl='';

  if(q.sym){
    // Number comparison question
    const symQ=`¿Qué símbolo va entre estos dos números?`;
    const shown=done[cur]?q.syms[q.symAns]:'?';
    const numDisplay=`
      <div class="cmp-number-row">
        <div class="cmp-num">${q.numA}</div>
        <div class="cmp-blank">${done[cur]?q.syms[q.symAns]:'?'}</div>
        <div class="cmp-num">${q.numB}</div>
      </div>`;
    extra=numDisplay;
    ctrl=`<div class="sym-wrap">${q.syms.map((s,i)=>{
      let cls='';
      if(done[cur]){if(i===q.symAns)cls='correct';else if(ans[cur]===i)cls='wrong';}
      return `<button class="sym-btn ${cls}" onclick="choose(${i})" ${done[cur]?'disabled':''}>${s}</button>`;
    }).join('')}</div>`;
  } else {
    ctrl=`<div class="options-grid">${q.opts.map((o,i)=>{
      let cls='';
      if(done[cur]){if(i===q.ans)cls='correct';else if(ans[cur]===i)cls='wrong';}
      return `<button class="opt-btn ${cls}" onclick="choose(${i})" ${done[cur]?'disabled':''}><span class="ltr">${letters[i]}</span><span>${o}</span></button>`;
    }).join('')}</div>`;
  }

  let fb='';
  if(done[cur]){
    const correct=ans[cur]===getAns(cur);
    let right='';
    if(q.sym) right=q.syms[q.symAns];
    else right=q.opts[q.ans];
    fb=`<div class="feedback ${correct?'ok':'no'} show">${correct?'✅ ¡Correcto!':'❌ Incorrecto — Respuesta correcta: <strong>'+right+'</strong>'}</div>`;
  }

  const sc=ans.filter((a,i)=>a===getAns(i)&&done[i]).length;
  const dn=done.filter(Boolean).length;

  const qText=q.sym?'¿Qué símbolo ( &lt;  &gt;  = ) va entre estos dos números?':q.q;

  document.getElementById('qCard').innerHTML=`
    <div class="sec-badge" style="background:${sec.color}">${sec.name}</div>
    <div class="q-num">Pregunta ${cur+1} de ${tot} · ${sec.name}</div>
    <div class="q-text">${qText}</div>
    ${extra}${ctrl}${fb}
    <div class="nav-row">
      <button class="nav-btn prev" onclick="goPrev()" ${cur===0?'disabled':''}>← Anterior</button>
      <span class="score-chip">✔ ${sc}/${dn}</span>
      <button class="nav-btn next" onclick="goNext()">${cur===tot-1?'Ver resultados →':'Siguiente →'}</button>
    </div>`;
}

function choose(i){
  if(done[cur]) return;
  ans[cur]=i;done[cur]=true;
  if(i===getAns(cur)) confetti(5);
  render();
}
function goPrev(){if(cur>0){cur--;render();}}
function goNext(){cur++;if(cur>=Q.length)showResults();else render();}
function jumpSection(s){const i=Q.findIndex(q=>q.sec===s);if(i!==-1){cur=i;render();}}

// ─── RESULTS ─────────────────────────────────────────────────────────────────
function showResults(){
  document.getElementById('qCard').style.display='none';
  document.getElementById('tabs').style.display='none';
  document.querySelector('.progress-wrap').style.display='none';
  document.querySelector('.progress-label').style.display='none';
  document.getElementById('resultsScreen').style.display='block';
  const tot=Q.length,sc=ans.filter((a,i)=>a===getAns(i)&&done[i]).length,pct=Math.round(sc/tot*100);
  document.getElementById('rScore').textContent=`${sc} / ${tot}`;
  let emoji='😢',msg='Sigue practicando, ¡tú puedes!';
  if(pct>=90){emoji='🏆';msg='¡Sobresaliente! ¡Eres un crack de las mates!';confetti(40);}
  else if(pct>=70){emoji='🌟';msg='¡Muy bien! Ya dominas la mayoría de los temas.';confetti(20);}
  else if(pct>=50){emoji='👍';msg='Bien, pero hay temas que repasar. ¡A por ello!';}
  document.getElementById('rEmoji').textContent=emoji;
  document.getElementById('rMsg').textContent=`${pct}% de aciertos — ${msg}`;
  document.getElementById('secScores').innerHTML=SECS.map((s,si)=>{
    const qs=Q.filter(q=>q.sec===si);
    const c=qs.filter(q=>{const i=Q.indexOf(q);return done[i]&&ans[i]===getAns(i);}).length;
    return `<div class="sec-sc" style="background:${s.bg}"><div class="sn" style="color:${s.color}">${s.name}</div><div class="sp" style="color:${s.color}">${c} / ${qs.length}</div></div>`;
  }).join('');
}
function restart(){
  cur=0;ans=new Array(Q.length).fill(null);done=new Array(Q.length).fill(false);
  document.getElementById('qCard').style.display='block';
  document.getElementById('tabs').style.display='flex';
  document.querySelector('.progress-wrap').style.display='block';
  document.querySelector('.progress-label').style.display='block';
  document.getElementById('resultsScreen').style.display='none';
  render();
}
function confetti(n){
  const cols=['#ef4444','#3b82f6','#22c55e','#a855f7','#f97316','#facc15'];
  for(let i=0;i<n;i++) setTimeout(()=>{
    const el=document.createElement('div');el.className='confetti-piece';
    Object.assign(el.style,{left:Math.random()*100+'vw',top:'-10px',
      background:cols[Math.floor(Math.random()*6)],
      transform:`rotate(${Math.random()*360}deg)`,
      width:(6+Math.random()*8)+'px',height:(6+Math.random()*8)+'px',
      animationDuration:(1.5+Math.random())+'s'});
    document.body.appendChild(el);setTimeout(()=>el.remove(),3000);
  },i*55);
}
render();
</script>
