<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matemáticas — Alana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../_componentes/examen.css" />
  <link rel="stylesheet" href="../_componentes/perfil.css" />
  <link rel="stylesheet" href="lista.css" />
</head>
<body class="lista">
  <div class="back"><a href="../index.html">← Inicio</a></div>
  <h1>🔢 Matemáticas</h1>
  <p class="subtitle" id="subtitle">Elige un examen para practicar</p>
  <div class="grid" id="examenes-grid"></div>

  <script src="../_componentes/almacen.js"></script>
  <script src="../_componentes/estrellas.js"></script>
  <script src="examenes.js"></script>
  <script>
    (function () {
      const p = Almacen.getPerfil();
      if (p.nombre) document.getElementById('subtitle').textContent = `Hola ${p.nombre}, elige un examen`;
      const grid = document.getElementById('examenes-grid');
      grid.innerHTML = EXAMENES.map(e => {
        // Las estrellas solo miden el modo fijo (el aleatorio no es comparable).
        const mejor = Almacen.mejorIntento(e.id, { modo: 'fijo' });
        const estrellas = mejor ? Estrellas.calcular(mejor.correctas, mejor.total) : 0;
        const pct = mejor ? Math.round((mejor.correctas / mejor.total) * 100) : null;
        const borradores = Almacen.listarBorradores(e.id);
        const fijo = borradores.find(b => b.modo === 'fijo');
        const aleatorio = borradores.find(b => b.modo === 'aleatorio');
        const chipFijo = fijo
          ? `<a class="chip-empezado" href="${e.url}">📌 Tienes uno empezado — Continuar →</a>` : '';
        const chipAleat = aleatorio
          ? `<a class="chip-empezado aleatorio" href="${e.url}?semilla=${aleatorio.semilla}">🎲 Aleatorio empezado — Continuar →</a>` : '';
        return `
          <article class="card">
            <div class="card-cuerpo">
              <span class="emoji">${e.emoji}</span>
              <div class="info">
                <h2>${e.titulo}</h2>
                <p>${e.descripcion}</p>
                <div class="examen-info">
                  ${Estrellas.render(estrellas)}
                  ${mejor ? `<span>Mejor: ${pct}% (${mejor.correctas}/${mejor.total})</span>` : '<span>Aún no lo has hecho</span>'}
                  ${chipFijo}
                  ${chipAleat}
                </div>
              </div>
            </div>
            <div class="card-acciones">
              <a class="card-boton primario" href="${e.url}">📋 Empezar</a>
              <a class="card-boton secundario" href="${e.url}?aleatorio=1" title="Ejercicios nuevos cada vez">🎲 Aleatorio</a>
            </div>
          </article>`;
      }).join('');
    })();
  </script>
</body>
</html>
